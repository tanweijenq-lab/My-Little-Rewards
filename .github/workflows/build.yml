
name: Build My Little Rewards

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Build Parent and Child APKs
        run: |
          gradle assembleParentDebug assembleChildDebug --stacktrace

      - name: Upload Parent APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: My-Little-Rewards-Parent-APK
          path: app/build/outputs/apk/parent/debug/app-parent-debug.apk

      - name: Upload Child APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: My-Little-Rewards-Child-APK
          path: app/build/outputs/apk/child/debug/app-child-debug.apk
